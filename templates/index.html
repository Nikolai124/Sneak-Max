<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="catalog">
        <div class="products">
            {% for product in products %}
                <div class="product-card">
                    <img src="{{ url_for('static', filename='img/catalog/' + product.image) }}" />
                    <h3>{{ product.name }}</h3>
                    <p>{{ product.price }}</p>
                </div>
            {% endfor %}
            <button name="show-more">Показать ещё</button>
        </div>
        <form class="filters">
            <legend>Подбор по параметрам</legend>
            <div class="price-filter">
                <legend>Цена, руб</legend>
                <input type="range" min="0" max="30000" value="1850" id="price-min-value"/>
                <input type="range" min="0" max="30000" value="25768" id="price-max-value"/>
            </div>
            <div class="gender-filter">
                <legend>Пол</legend>
                <input type="checkbox" name="male-gender"/>мужской
                <input type="checkbox" name="female gender"/>женский
            </div>
            <div class="size-filter">
                <legend>Размер</legend> 
                <div class="size-filter-btn-group">
                    <label>
                        <input type="checkbox" class="size" name="size" value="35"/>
                        <span>35</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="36"/>
                        <span>36</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="37"/>
                        <span>37</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="38"/>
                        <span>38</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="39"/>
                        <span>39</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="40"/>
                        <span>40</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="41"/>
                        <span>41</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="42"/>
                        <span>42</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="43"/>
                        <span>43</span>
                    </label>
                </div>
            </div>
            <button name="apply" type="button">Применить</button>
            <button name="reset" type="reset">Сбросить</button>
        </form>
    </div>
</body>
</html>
