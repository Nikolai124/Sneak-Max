<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SneakMax - Каталог</title>
</head>
<body>
    <h1 class="catalog-title">Каталог</h1>
    <div class="catalog">
        <div class="products">
            {% for product in products %}
                <div class="product-card">
                    <div class="product-image">
                        <img src="{{ url_for('static', filename='img/catalog/' + product.image) }}" alt="{{ product.name }}" class="img-product"/>
                        <div class="product-actions">
                            <button class="product-action product-action-view" type="button" aria-label="Быстрый просмотр"></button>
                            <button class="product-action product-action-cart" type="button" aria-label="В корзину"></button>
                        </div>
                    </div>
                    <h3 class="product-name">{{ product.name }}</h3>
                    <p class="product-price">{{ product.price }} ₽</p>
                </div>
            {% endfor %}
            <button class="show-more">Показать ещё</button>
        </div>
        <form class="filters">
            <legend>Подбор по параметрам</legend>
            <div class="price-filter">
                <legend>Цена, руб</legend>
                <div class="price-input">
                    <div class="price-field">
                        <input type="number" class="min-input" value="1850">
                    </div>
                    <div class="price-field">
                        <input type="number" class="max-input" value="25768">
                    </div>
                </div>
                <div class="price-slider-wrap">
                    <div class="slider">
                        <div class="price-slider"></div>
                    </div>
                    <div class="range-input">
                        <input type="range" min="0" max="30000" value="1850" class="min-range" step="1"/>
                        <input type="range" min="0" max="30000" value="25768" class="max-range" step="1"/>
                    </div>
                </div>
            </div>
            <div class="gender-filter">
                <legend>Пол</legend>
                <div class="gender-filter-group">
                    <label>
                        <input type="checkbox" name="male-gender"/>
                        <span>мужской</span>
                    </label>
                    <label>
                        <input type="checkbox" name="female-gender"/>
                        <span>женский</span>
                    </label>
                </div>
            </div>
            <div class="size-filter">
                <legend>Размер</legend> 
                <div class="size-filter-btn-group">
                    <label>
                        <input type="checkbox" class="size" name="size" value="35"/>
                        <span>35</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="36"/>
                        <span>36</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="37"/>
                        <span>37</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="38"/>
                        <span>38</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="39"/>
                        <span>39</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="40"/>
                        <span>40</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="41"/>
                        <span>41</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="42"/>
                        <span>42</span>
                    </label>
                    <label>
                        <input type="checkbox" class="size" name="size" value="43"/>
                        <span>43</span>
                    </label>
                </div>
            </div>
            <button name="apply" type="button">Применить</button>
            <button name="reset" type="reset">Сбросить</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
